<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevStackReads — Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/app.js" defer></script>
  <script src="./js/store.js" defer></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 sm:p-6">
  <main class="max-w-6xl mx-auto space-y-8">
    <header class="flex flex-wrap justify-between items-center bg-white p-6 rounded-2xl shadow-sm border gap-3">
      <div><h1 class="text-2xl font-black">DevStackReads Admin</h1><p class="text-xs text-gray-500">Manage products and customer orders</p></div>
      <div class="flex gap-2"><a href="index.html" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-xs font-bold">Website</a><button onclick="logoutUser()" class="border px-4 py-2 rounded-xl text-xs font-bold">Logout</button></div>
    </header>
    <p id="admin-message" class="text-sm" role="status">Checking administrator access...</p>
    <div id="admin-content" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
      <section class="bg-white p-6 rounded-2xl border shadow-sm">
        <h2 class="text-lg font-bold mb-4">Add New Product</h2>
        <form id="product-form" class="space-y-4">
          <div><label for="p-title" class="block text-xs font-semibold mb-1">Product Title</label><input id="p-title" required maxlength="160" class="form-control"></div>
          <div><label for="p-price" class="block text-xs font-semibold mb-1">Price (USD)</label><input id="p-price" type="number" min="0.01" step="0.01" required class="form-control"></div>
          <div><label for="p-cat" class="block text-xs font-semibold mb-1">Category</label><input id="p-cat" required maxlength="80" class="form-control"></div>
          <div><label for="p-img" class="block text-xs font-semibold mb-1">Image URL (HTTPS)</label><input id="p-img" type="url" required class="form-control"></div>
          <button class="w-full bg-[#d9381e] text-white font-bold py-3 rounded-xl">Save Product</button>
          <p id="product-message" class="text-sm" role="status"></p>
        </form>
      </section>
      <section class="bg-white p-6 rounded-2xl border shadow-sm">
        <h2 class="text-lg font-bold mb-4">Recent Orders</h2>
        <div id="admin-orders-list" class="space-y-3 text-sm">Loading orders...</div>
      </section>
    </div>
  </main>
</body>
</html>
