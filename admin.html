<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStackReads — Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-8">
        <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div>
                <h1 class="text-2xl font-black text-gray-900">DevStackReads Admin</h1>
                <p class="text-xs text-gray-500">Manage store products and monitor customer orders</p>
            </div>
            <a href="index.html" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-xs font-bold">Go to Website</a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Add Product Form -->
            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <h2 class="text-lg font-bold mb-4">Add New Product</h2>
                <form onsubmit="adminAddProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1">Product Title</label>
                        <input type="text" id="p-title" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">Price ($)</label>
                        <input type="number" step="0.01" id="p-price" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">Category</label>
                        <input type="text" id="p-cat" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">Image URL</label>
                        <input type="url" id="p-img" required class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-[#d9381e] text-white font-bold py-2.5 rounded-xl text-xs">Save Product</button>
                </form>
            </div>

            <!-- Orders Table -->
            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <h2 class="text-lg font-bold mb-4">Recent Telegram Orders</h2>
                <div id="admin-orders-list" class="space-y-3 text-xs text-gray-600">
                    <p class="text-gray-400">No orders received yet.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/store.js"></script>
    <script>
        function adminAddProduct(e) {
            e.preventDefault();
            const newProd = {
                id: Date.now(),
                title: document.getElementById('p-title').value,
                price: parseFloat(document.getElementById('p-price').value),
                category: document.getElementById('p-cat').value,
                image: document.getElementById('p-img').value
            };
            let products = JSON.parse(localStorage.getItem('devstack_products')) || defaultProducts;
            products.push(newProd);
            localStorage.setItem('devstack_products', JSON.stringify(products));
            alert('Product added successfully!');
            e.target.reset();
        }
    </script>
</body>
</html>
