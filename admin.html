<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStackReads - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap');
        .font-serif-custom { font-family: 'Playfair Display', serif; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-center items-center">

    <!-- Login Container -->
    <div id="login-section" class="max-w-md w-full bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
        <div class="text-center mb-6">
            <span class="bg-[#d9381e] text-white font-black text-xs px-2.5 py-1.5 rounded-lg">RESTRICTED</span>
            <h2 class="font-serif-custom text-2xl font-bold mt-3 text-gray-900">Admin Authentication</h2>
            <p class="text-xs text-gray-500 mt-1">Enter your database credentials to manage DevStackReads.</p>
        </div>

        <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Admin Email</label>
                <input type="email" id="admin-email" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#d9381e]" placeholder="admin@devstackreads.com">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Password</label>
                <input type="password" id="admin-password" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#d9381e]" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-[#d9381e] hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-xs">
                Login to Dashboard
            </button>
        </form>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs font-bold text-gray-500 hover:text-[#d9381e]">← Back to Storefront</a>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden by default) -->
    <div id="admin-dashboard" class="hidden w-full max-w-7xl mx-auto px-4 py-8 flex-grow flex flex-col">
        <!-- Top Navigation -->
        <header class="bg-white border border-gray-200 sticky top-0 z-50 mb-8 rounded-2xl px-6 py-4 flex items-center justify-between shadow-xs">
            <div class="flex items-center space-x-3">
                <span class="bg-[#d9381e] text-white font-black text-xs px-2.5 py-1.5 rounded-lg">ADMIN</span>
                <h1 class="font-serif-custom text-xl font-bold tracking-tight text-gray-900">DevStackReads Dashboard</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs font-bold text-gray-600" id="logged-in-user"></span>
                <button onclick="handleLogout()" class="text-xs font-bold text-red-500 hover:underline">Logout</button>
            </div>
        </header>

        <!-- Grid Layout: Add Book Form & Books Catalog -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Book Form -->
            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-xs h-fit">
                <h3 class="font-bold text-sm uppercase tracking-wider text-gray-900 mb-4">Add New Book</h3>
                <form id="add-book-form" onsubmit="handleAddBook(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Book Title</label>
                        <input type="text" id="book-title" required class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#d9381e]" placeholder="የልብ ሚዛን">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Author</label>
                        <input type="text" id="book-author" required class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#d9381e]" placeholder="ደራሲው ስም">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Price (ETB)</label>
                        <input type="number" step="0.01" id="book-price" required class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#d9381e]" placeholder="500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Image URL</label>
                        <input type="url" id="book-image" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#d9381e]" placeholder="https://example.com/image.jpg">
                    </div>
                    <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-2.5 rounded-xl text-xs transition shadow-xs">
                        Save Book to Database
                    </button>
                </form>
            </div>

            <!-- Store Products Catalog List -->
            <div class="lg:col-span-2 bg-white rounded-2xl border border-gray-200 p-6 shadow-xs">
                <h3 class="font-bold text-sm uppercase tracking-wider text-gray-900 mb-4">Store Products Catalog</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs text-gray-500 uppercase">
                                <th class="py-3 px-4">Title</th>
                                <th class="py-3 px-4">Author</th>
                                <th class="py-3 px-4">Price</th>
                                <th class="py-3 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-books-list" class="text-sm divide-y divide-gray-100">
                            <!-- Books will be loaded here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("admin_session_token");
            const email = localStorage.getItem("admin_email");
            if (token && email) {
                showDashboard(email);
            }
        });

        async function handleAdminLogin(event) {
            event.preventDefault();
            const email = document.getElementById("admin-email").value.trim();
            const password = document.getElementById("admin-password").value.trim();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem("admin_session_token", data.token);
                    localStorage.setItem("admin_email", data.email);
                    showDashboard(data.email);
                } else {
                    alert(data.message || "መግባት አልተቻለም!");
                }
            } catch (error) {
                console.error("Connection error:", error);
                alert("ከዳታቤዙ ጋር መገናኘት አልተቻለም።");
            }
        }

        function showDashboard(email) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("admin-dashboard").classList.remove("hidden");
            document.getElementById("logged-in-user").textContent = email;
            loadAdminBooks();
        }

        async function loadAdminBooks() {
            try {
                const response = await fetch('/api/books');
                const data = await response.json();
                const tbody = document.getElementById("admin-books-list");
                tbody.innerHTML = "";

                if (data.success && data.books.length > 0) {
                    data.books.forEach(book => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b border-gray-100">
                                <td class="py-3 px-4 font-medium text-gray-900">${book.title}</td>
                                <td class="py-3 px-4 text-gray-600">${book.author}</td>
                                <td class="py-3 px-4 text-gray-600">${book.price} ETB</td>
                                <td class="py-3 px-4 text-right">
                                    <button onclick="deleteBook(${book.id})" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-bold transition">
                                        <i class="fa-solid fa-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-xs text-gray-400">ምንም መጽሐፍ አልተመዘገበም።</td></tr>`;
                }
            } catch (error) {
                console.error("Error loading books:", error);
            }
        }

        async function handleAddBook(event) {
            event.preventDefault();
            const title = document.getElementById("book-title").value.trim();
            const author = document.getElementById("book-author").value.trim();
            const price = document.getElementById("book-price").value.trim();
            const image_url = document.getElementById("book-image").value.trim();

            try {
                const response = await fetch('/api/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author, price, image_url })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    alert("መጽሐፉ በተሳካ ሁኔታ ተመዝግቧል!");
                    document.getElementById("add-book-form").reset();
                    loadAdminBooks();
                } else {
                    alert(data.message || "መመዝገብ አልተቻለም።");
                }
            } catch (error) {
                console.error("Error adding book:", error);
                alert("ሰርቨር ጋር መገናኘት አልተቻለም።");
            }
        }

        async function deleteBook(id) {
            if (!confirm("ይህንን መጽሐፍ በእርግጥ መሰረዝ ይፈልጋሉ?")) return;

            try {
                const response = await fetch('/api/books', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    alert("መጽሐፉ ተሰርዟል!");
                    loadAdminBooks();
                } else {
                    alert(data.message || "መሰረዝ አልተቻለም።");
                }
            } catch (error) {
                console.error("Error deleting book:", error);
                alert("ሰርቨር ጋር መገናኘት አልተቻለም።");
            }
        }

        function handleLogout() {
            localStorage.removeItem("admin_session_token");
            localStorage.removeItem("admin_email");
            location.reload();
        }
    </script>

</body>
</html>
