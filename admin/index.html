
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevStackReads — Admin Control Center</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap');

body {
    font-family: Inter, sans-serif;
}

.font-serif-custom {
    font-family: 'Playfair Display', serif;
}

.navbtn {
    display: flex;
    gap: .7rem;
    align-items: center;
    width: 100%;
    padding: .7rem .85rem;
    border-radius: .7rem;
    text-align: left;
    font-size: .82rem;
    font-weight: 700;
    color: #4b5563;
}

.navbtn.active,
.navbtn:hover {
    background: #fff1ed;
    color: #d9381e;
}

.field {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: .65rem;
    padding: .65rem .75rem;
    font-size: .85rem;
    background: white;
}

.panel {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 1rem;
    padding: 1.2rem;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}
</style>
</head>

<body class="bg-gray-50 min-h-screen">

<!-- LOGIN -->
<section id="login-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl border max-w-md w-full shadow-sm">

        <div class="text-center mb-6">
            <span class="bg-[#d9381e] text-white text-xs font-black px-3 py-2 rounded-lg">
                RESTRICTED
            </span>

            <h1 class="font-serif-custom text-2xl font-bold mt-4">
                Admin Authentication
            </h1>

            <p class="text-xs text-gray-500 mt-2">
                Sign in to manage DevStackReads.
            </p>
        </div>

        <form id="login-form" class="space-y-3">
            <input id="email" type="email" required class="field" placeholder="Admin email">
            <input id="password" type="password" required class="field" placeholder="Password">

            <button id="login-button" type="submit"
                class="w-full bg-[#d9381e] text-white rounded-xl py-3 text-sm font-bold">
                Login to Dashboard
            </button>
        </form>

        <p id="login-error" class="text-red-600 text-xs mt-3"></p>

        <a href="../" class="block text-center mt-5 text-xs text-gray-500">
            ← Back to Storefront
        </a>
    </div>
</section>

<!-- ADMIN APPLICATION -->
<div id="app" class="hidden min-h-screen">

    <header class="bg-white border-b px-4 lg:px-8 py-3 flex justify-between items-center sticky top-0 z-30">

        <div class="flex items-center gap-3">
            <button id="mobile-menu" class="lg:hidden" type="button">
                <i class="fa fa-bars"></i>
            </button>

            <span class="bg-[#d9381e] text-white font-black px-2 py-1 rounded">
                DS
            </span>

            <b class="font-serif-custom text-lg">
                DevStackReads Control Center
            </b>
        </div>

        <div class="flex items-center gap-3 text-xs">
            <span id="admin-name" class="font-bold"></span>

            <button id="logout" class="text-red-600 font-bold" type="button">
                Logout
            </button>
        </div>
    </header>

    <div class="max-w-[1500px] mx-auto flex">

        <!-- SIDEBAR -->
        <aside id="sidebar"
            class="hidden lg:block w-60 shrink-0 p-4 min-h-[calc(100vh-60px)] bg-white border-r">

            <p class="text-[10px] uppercase tracking-widest text-gray-400 font-black px-3 mb-2">
                Management
            </p>

            <nav id="nav" class="space-y-1">

                <button class="navbtn active" data-page="overview">
                    <i class="fa fa-chart-pie"></i> Overview
                </button>

                <button class="navbtn" data-page="articles">
                    <i class="fa fa-newspaper"></i> Articles
                </button>

                <button class="navbtn" data-page="books">
                    <i class="fa fa-book"></i> Books & Products
                </button>

                <button class="navbtn" data-page="orders">
                    <i class="fa fa-cart-shopping"></i> Orders
                </button>

                <button class="navbtn" data-page="users">
                    <i class="fa fa-users"></i> Users
                </button>

                <button class="navbtn" data-page="events">
                    <i class="fa fa-calendar"></i> Events
                </button>

                <button class="navbtn" data-page="newsletter">
                    <i class="fa fa-envelope"></i> Newsletter
                </button>

                <button class="navbtn" data-page="settings">
                    <i class="fa fa-sliders"></i> Website Settings
                </button>

                <button class="navbtn" data-page="logs">
                    <i class="fa fa-shield-halved"></i> Audit Logs
                </button>

            </nav>

            <a href="../" class="block text-xs text-gray-500 mt-8 px-3">
                ↗ View website
            </a>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 min-w-0 p-4 lg:p-8">

            <div class="flex items-center justify-between mb-6">
                <div>
                    <p class="text-xs text-gray-400">DEVSTACKREADS / ADMIN</p>
                    <h1 id="page-title" class="text-2xl font-black font-serif-custom">
                        Overview
                    </h1>
                </div>

                <button id="refresh" type="button"
                    class="text-xs bg-white border rounded-lg px-3 py-2">
                    <i class="fa fa-rotate"></i> Refresh
                </button>
            </div>

            <div id="content" class="space-y-5"></div>

        </main>
    </div>
</div>

<script>
"use strict";

/* --------------------------------
   HELPERS
-------------------------------- */

const $ = selector => document.querySelector(selector);

let activePage = "overview";
let cache = {};

const API = {
    adminOverview: "/api/admin?view=overview",
    adminManage: "/api/admin?view=manage"
};

async function api(url, options = {}) {
    const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
            ...(options.headers || {}),
            ...(options.body ? { "Content-Type": "application/json" } : {})
        }
    });

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("The server returned an invalid response. Check the API route.");
    }

    if (!response.ok || data.success === false) {
        throw new Error(data.message || `Request failed (${response.status}).`);
    }

    return data;
}

function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function setContent(html) {
    $("#content").innerHTML = html;
}

function formField(label, id, type = "text", value = "") {
    return `
        <label class="block text-xs font-bold text-gray-600">
            ${esc(label)}
            <input
                id="${esc(id)}"
                type="${esc(type)}"
                class="field mt-1"
                value="${esc(value)}"
            >
        </label>
    `;
}

function btn(text, id) {
    return `
        <button
            type="button"
            id="${esc(id)}"
            class="bg-[#d9381e] text-white rounded-lg px-4 py-2 text-xs font-bold">
            ${esc(text)}
        </button>
    `;
}

function showError(error) {
    setContent(`
        <div class="panel text-red-600 text-sm">
            <i class="fa fa-circle-exclamation mr-2"></i>
            ${esc(error.message || "An unexpected error occurred.")}
        </div>
    `);
}

/* --------------------------------
   AUTHENTICATION
-------------------------------- */

async function boot() {
    try {
        const data = await api("/api/auth/me");

        if (!data.user || !["admin", "editor"].includes(data.user.role)) {
            throw new Error("Admin access required.");
        }

        $("#login-section").classList.add("hidden");
        $("#app").classList.remove("hidden");
        $("#admin-name").textContent = data.user.email;

        await loadPage("overview");

    } catch (error) {
        $("#login-error").textContent = error.message;
        $("#login-section").classList.remove("hidden");
        $("#app").classList.add("hidden");
    }
}

$("#login-form").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("#login-button");
    button.disabled = true;
    button.textContent = "Signing in...";

    try {
        const data = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
                email: $("#email").value.trim(),
                password: $("#password").value
            })
        });

        if (!data.user || !["admin", "editor"].includes(data.user.role)) {
            await api("/api/auth/logout", { method: "POST" });
            throw new Error("This account does not have admin access.");
        }

        $("#login-error").textContent = "";
        await boot();

    } catch (error) {
        $("#login-error").textContent = error.message;

    } finally {
        button.disabled = false;
        button.textContent = "Login to Dashboard";
    }
});

$("#logout").addEventListener("click", async () => {
    try {
        await api("/api/auth/logout", { method: "POST" });
        location.reload();
    } catch (error) {
        alert(error.message);
    }
});

/* --------------------------------
   NAVIGATION
-------------------------------- */

$("#nav").addEventListener("click", event => {
    const button = event.target.closest("[data-page]");

    if (button) {
        loadPage(button.dataset.page);

        if (window.innerWidth < 1024) {
            $("#sidebar").classList.add("hidden");
        }
    }
});

$("#mobile-menu").addEventListener("click", () => {
    $("#sidebar").classList.toggle("hidden");
});

$("#refresh").addEventListener("click", () => {
    loadPage(activePage);
});

/* --------------------------------
   OVERVIEW
-------------------------------- */

async function loadOverview() {
    const data = await api(API.adminOverview);
    const stats = data.stats || {};

    const cards = [
        ["Users", stats.users, "fa-users"],
        ["Books", stats.books, "fa-book"],
        ["Articles", stats.articles, "fa-newspaper"],
        ["Orders", stats.orders, "fa-cart-shopping"],
        ["Revenue", Number(stats.revenue || 0).toFixed(2) + " ETB", "fa-coins"],
        ["Subscribers", stats.subscribers, "fa-envelope"]
    ];

    setContent(`
        <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
            ${cards.map(item => `
                <div class="panel">
                    <i class="fa ${item[2]} text-[#d9381e]"></i>
                    <p class="text-xs text-gray-500 mt-3">${esc(item[0])}</p>
                    <b class="text-2xl">${esc(item[1] ?? 0)}</b>
                </div>
            `).join("")}
        </div>

        <div class="panel">
            <b>Administration status</b>
            <p class="text-xs text-gray-500 mt-2">
                Your website content and business records are stored in Neon.
                Use the navigation to manage each area.
            </p>
        </div>
    `);
}

/* --------------------------------
   ARTICLES
-------------------------------- */

async function loadArticles() {
    const data = await api("/api/articles?admin=1");

    cache.articles = data.articles || [];

    setContent(`
        <div class="panel space-y-3">
            <h2 class="font-bold">Write / Edit Article</h2>

            <input id="a-id" type="hidden">

            <input id="a-title" class="field" placeholder="Article title">

            <div class="grid md:grid-cols-2 gap-3">
                <input id="a-author" class="field" placeholder="Author">
                <input id="a-category" class="field" placeholder="Category (CSS, UX, JavaScript...)">
            </div>

            <input id="a-image" class="field" placeholder="Featured image URL">

            <textarea id="a-excerpt" class="field" rows="2"
                placeholder="Short excerpt"></textarea>

            <textarea id="a-content" class="field" rows="10"
                placeholder="Write the full article here..."></textarea>

            <div class="flex flex-wrap gap-2">
                ${btn("Save Draft", "a-draft")}
                ${btn("Publish Article", "a-publish")}

                <button id="a-clear" type="button"
                    class="border rounded-lg px-4 text-xs">
                    Clear
                </button>
            </div>
        </div>

        <div class="panel">
            <h2 class="font-bold mb-3">Articles</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-xs">
                    <tbody>
                        ${cache.articles.map(article => `
                            <tr class="border-t">
                                <td class="py-3">${esc(article.title)}</td>
                                <td>${esc(article.status || "—")}</td>
                                <td class="text-right whitespace-nowrap">
                                    <button type="button"
                                        class="text-blue-600 mr-3"
                                        data-edit="${esc(article.id)}">
                                        Edit
                                    </button>

                                    <button type="button"
                                        class="text-red-600"
                                        data-delete="${esc(article.id)}">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        </div>
    `);

    const saveArticle = async status => {
        const id = $("#a-id").value;

        const body = {
            title: $("#a-title").value.trim(),
            author: $("#a-author").value.trim(),
            category: $("#a-category").value.trim(),
            image_url: $("#a-image").value.trim(),
            excerpt: $("#a-excerpt").value.trim(),
            content: $("#a-content").value,
            status
        };

        if (id) body.id = id;

        if (!body.title || !body.content.trim()) {
            alert("Article title and content are required.");
            return;
        }

        try {
            await api("/api/articles", {
                method: id ? "PUT" : "POST",
                body: JSON.stringify(body)
            });

            alert("Article saved successfully.");
            await loadArticles();

        } catch (error) {
            alert(error.message);
        }
    };

    $("#a-draft").onclick = () => saveArticle("draft");
    $("#a-publish").onclick = () => saveArticle("published");
    $("#a-clear").onclick = () => loadArticles();
}

/* --------------------------------
   BOOKS
-------------------------------- */

async function loadBooks() {
    const data = await api("/api/books");

    cache.books = data.books || [];

    setContent(`
        <div class="panel space-y-3">
            <h2 class="font-bold">Add a book</h2>

            <div class="grid md:grid-cols-2 gap-3">
                ${formField("Title", "b-title")}
                ${formField("Author", "b-author")}
                ${formField("Price ETB", "b-price", "number")}
                ${formField("Stock", "b-stock", "number")}
                ${formField("Image URL", "b-image", "url")}
            </div>

            <textarea id="b-description" class="field"
                placeholder="Description"></textarea>

            ${btn("Save Book", "b-save")}
        </div>

        <div class="panel">
            <h2 class="font-bold mb-3">Catalog</h2>

            ${cache.books.map(book => `
                <div class="border-t py-3 flex justify-between gap-3 text-xs">
                    <div>
                        <b>${esc(book.title)}</b>
                        <p class="text-gray-500">
                            ${esc(book.author)} · ${esc(book.price)} ETB · stock ${esc(book.stock)}
                        </p>
                    </div>

                    <button type="button"
                        class="text-red-600"
                        data-book-delete="${esc(book.id)}">
                        Archive
                    </button>
                </div>
            `).join("")}
        </div>
    `);

    $("#b-save").onclick = async () => {
        const body = {
            title: $("#b-title").value.trim(),
            author: $("#b-author").value.trim(),
            price: $("#b-price").value,
            stock: $("#b-stock").value,
            image_url: $("#b-image").value.trim(),
            description: $("#b-description").value
        };

        try {
            await api("/api/books", {
                method: "POST",
                body: JSON.stringify(body)
            });

            alert("Book saved successfully.");
            await loadBooks();

        } catch (error) {
            alert(error.message);
        }
    };
}

/* --------------------------------
   ORDERS / USERS / LOGS
-------------------------------- */

async function loadManagement(page) {
    const data = await api(API.adminManage);

    cache.manage = data;

    const rows = page === "orders"
        ? data.orders || []
        : page === "users"
            ? data.users || []
            : data.logs || [];

    setContent(`
        <div class="panel overflow-x-auto">
            <table class="w-full text-xs">
                <tbody>
                    ${rows.map(item => `
                        <tr class="border-t">
                            <td class="py-3 pr-3">${esc(item.id)}</td>

                            <td class="pr-3">
                                ${esc(item.customer_name || item.name || item.action || "")}
                            </td>

                            <td class="pr-3">
                                ${esc(item.customer_email || item.email || item.target_type || "")}
                            </td>

                            <td class="pr-3">
                                ${esc(item.status || item.role || item.created_at || "")}
                            </td>

                            <td>
                                ${page === "orders" ? `
                                    <select data-order="${esc(item.id)}"
                                        class="border rounded p-1">
                                        ${["pending", "paid", "processing", "completed", "cancelled"]
                                            .map(status => `
                                                <option value="${status}"
                                                    ${item.status === status ? "selected" : ""}>
                                                    ${status}
                                                </option>
                                            `).join("")}
                                    </select>
                                ` : page === "users" ? `
                                    <select data-user="${esc(item.id)}"
                                        class="border rounded p-1">
                                        <option value="user"
                                            ${item.role === "user" ? "selected" : ""}>
                                            user
                                        </option>

                                        <option value="editor"
                                            ${item.role === "editor" ? "selected" : ""}>
                                            editor
                                        </option>

                                        <option value="admin"
                                            ${item.role === "admin" ? "selected" : ""}>
                                            admin
                                        </option>
                                    </select>
                                ` : ""}
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `);
}

/* --------------------------------
   EVENTS
-------------------------------- */

async function loadEvents() {
    setContent(`
        <div class="panel space-y-3">
            <h2 class="font-bold">Create Event</h2>

            <input id="e-title" class="field" placeholder="Event title">

            <textarea id="e-desc" class="field"
                placeholder="Description"></textarea>

            <input id="e-date" type="datetime-local" class="field">

            <input id="e-location" class="field" placeholder="Location">

            ${btn("Publish Event", "e-save")}
        </div>
    `);

    $("#e-save").onclick = async () => {
        const body = {
            title: $("#e-title").value.trim(),
            description: $("#e-desc").value,
            event_date: $("#e-date").value || null,
            location: $("#e-location").value
        };

        try {
            await api("/api/events", {
                method: "POST",
                body: JSON.stringify(body)
            });

            alert("Event saved successfully.");

        } catch (error) {
            alert(error.message);
        }
    };
}

/* --------------------------------
   NEWSLETTER
-------------------------------- */

async function loadNewsletter() {
    const data = await api("/api/newsletter");
    const subscribers = data.subscribers || [];

    setContent(`
        <div class="panel">
            <h2 class="font-bold mb-3">
                Newsletter Subscribers (${subscribers.length})
            </h2>

            ${subscribers.map(subscriber => `
                <p class="border-t py-2 text-xs">
                    ${esc(subscriber.email)} · ${esc(subscriber.status)}
                </p>
            `).join("")}
        </div>
    `);
}

/* --------------------------------
   SETTINGS
-------------------------------- */

async function loadSettings() {
    const data = await api("/api/settings");
    const settings = data.settings || {};

    setContent(`
        <div class="panel space-y-3">
            <h2 class="font-bold">Website Settings</h2>

            <p class="text-xs text-gray-500">
                Manage basic public website identity and hero text.
                Additional settings can be added as the site grows.
            </p>

            <input id="s-title" class="field"
                placeholder="Site title"
                value="${esc(settings.site_title || "DevStackReads")}">

            <input id="s-hero" class="field"
                placeholder="Hero headline"
                value="${esc(settings.hero_title || "")}">

            ${btn("Save Settings", "s-save")}
        </div>
    `);

    $("#s-save").onclick = async () => {
        try {
            await api("/api/settings", {
                method: "PUT",
                body: JSON.stringify({
                    settings: {
                        site_title: $("#s-title").value,
                        hero_title: $("#s-hero").value
                    }
                })
            });

            alert("Settings saved successfully.");

        } catch (error) {
            alert(error.message);
        }
    };
}

/* --------------------------------
   MAIN PAGE LOADER
-------------------------------- */

async function loadPage(page) {
    activePage = page;

    document.querySelectorAll(".navbtn").forEach(button => {
        button.classList.toggle("active", button.dataset.page === page);
    });

    $("#page-title").textContent =
        page.charAt(0).toUpperCase() + page.slice(1);

    setContent(`
        <div class="panel text-gray-500 text-sm">
            <i class="fa fa-spinner fa-spin mr-2"></i>
            Loading...
        </div>
    `);

    try {
        switch (page) {
            case "overview":
                await loadOverview();
                break;

            case "articles":
                await loadArticles();
                break;

            case "books":
                await loadBooks();
                break;

            case "orders":
            case "users":
            case "logs":
                await loadManagement(page);
                break;

            case "events":
                await loadEvents();
                break;

            case "newsletter":
                await loadNewsletter();
                break;

            case "settings":
                await loadSettings();
                break;

            default:
                throw new Error("Unknown dashboard page.");
        }

    } catch (error) {
        console.error("Admin page error:", error);
        showError(error);
    }
}

/* --------------------------------
   SHARED CLICK / CHANGE EVENTS
-------------------------------- */

$("#content").addEventListener("click", async event => {
    const editButton = event.target.closest("[data-edit]");
    const deleteButton = event.target.closest("[data-delete]");
    const archiveButton = event.target.closest("[data-book-delete]");

    try {
        if (editButton) {
            const id = editButton.dataset.edit;
            const article = cache.articles?.find(item => String(item.id) === String(id));

            if (!article) {
                throw new Error("Article not found.");
            }

            $("#a-id").value = article.id;
            $("#a-title").value = article.title || "";
            $("#a-author").value = article.author || "";
            $("#a-category").value = article.category || "";
            $("#a-image").value = article.image_url || "";
            $("#a-excerpt").value = article.excerpt || "";
            $("#a-content").value = article.content || "";

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        if (deleteButton) {
            const id = deleteButton.dataset.delete;

            if (confirm("Delete this article?")) {
                await api("/api/articles", {
                    method: "DELETE",
                    body: JSON.stringify({ id })
                });

                alert("Article deleted.");
                await loadArticles();
            }
        }

        if (archiveButton) {
            const id = archiveButton.dataset.bookDelete;

            if (confirm("Archive this book?")) {
                await api("/api/books", {
                    method: "DELETE",
                    body: JSON.stringify({ id })
                });

                alert("Book archived.");
                await loadBooks();
            }
        }

    } catch (error) {
        alert(error.message);
    }
});

$("#content").addEventListener("change", async event => {
    const target = event.target;

    try {
        if (target.dataset.order) {
            await api(API.adminManage, {
                method: "PATCH",
                body: JSON.stringify({
                    order_id: target.dataset.order,
                    order_status: target.value
                })
            });

            alert("Order status updated.");
        }

        if (target.dataset.user) {
            await api(API.adminManage, {
                method: "PATCH",
                body: JSON.stringify({
                    user_id: target.dataset.user,
                    role: target.value
                })
            });

            alert("User role updated.");
        }

    } catch (error) {
        alert(error.message);
        await loadPage(activePage);
    }
});

/* --------------------------------
   START APPLICATION
-------------------------------- */

boot();

</script>
